name: Update profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Draw the images
        run: python -m extras.build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: dist

      # GitHub's own gh-skyline extension turns this year's contributions into a 3D model.
      # GitHub shows .stl files in an interactive 3D viewer. If this step fails, the rest still publishes.
      - name: Build the 3D skyline
        continue-on-error: true
        run: |
          gh extension install github/gh-skyline
          gh skyline --user "${GITHUB_REPOSITORY_OWNER}" --output dist/skyline.stl
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The images live on a branch with one commit, so the history does not grow with every run.
      - name: Publish to the output branch
        working-directory: dist
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Update profile images"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub turns off scheduled workflows after 60 days without repository activity.
      # Enabling the workflow again through the API resets that timer.
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
