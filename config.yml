# Settings for update.py, which fills in the generated parts of README.md every day.
username: Likheet

stats:
  ignore_languages: ["HTML", "CSS", "Shell", "Makefile", "PowerShell", "Batchfile", "Jupyter Notebook"]

projects:
  limit: 6               # my most recently pushed public repositories; the rest go under "More projects"
  show_stars_from: 5     # smaller star counts are left out
  first:                 # always at the top, for projects whose repositories are private
    - name: "Life Ledger"
      url: "https://life-ledger.tech"
      note: "Public beta"
      description: "Tasks, goals, meals and money in one app, with an assistant that turns what you say into entries."
  exclude:               # repositories that are not projects of their own
    - ytmfast.com        # YTFast's website
    - ytfast-releases    # YTFast's downloads
    - portfolio          # replaced by portfolio-2.0
    - likheetshetty      # replaced by portfolio-2.0
    - Leetcode-problems
    - starbucks-landing-page
    - coke-landing-page
    - todo-list
    - dictionary

open_source:
  min_stars: 100         # leave out pull requests to smaller projects
  limit: 8
  exclude:
    - is-a-dev/register                    # domain registration, not code
    - firstcontributions/first-contributions  # a tutorial
