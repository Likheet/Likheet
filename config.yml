# Settings for build.py, which draws the profile's images every hour from live GitHub data.
username: Likheet
name: "Likheet Shetty"
handle: "likheet@sydney"
builds: "native apps, AI tools, browser extensions"
studying: "Master of IT, UNSW Sydney"
ignore_languages: ["HTML", "CSS", "Shell", "Makefile", "PowerShell", "Batchfile", "Jupyter Notebook"]

projects:
  limit: 5               # my most recently pushed public repositories, after the ones under `first`
  show_stars_from: 5     # smaller star counts are left out
  first:                 # always first, for projects whose repositories are private
    - name: "Life Ledger"
      note: "Public beta"
      link: "life-ledger.tech"
      description: "Tasks, goals, meals and money in one app, with an assistant that turns what you say into entries."
  exclude:               # repositories that are not projects of their own
    - ytmfast.com        # YTFast's website
    - ytfast-releases    # YTFast's downloads
    - portfolio          # replaced by portfolio-2.0
    - likheetshetty      # replaced by portfolio-2.0
    - Leetcode-problems
    - starbucks-landing-page
    - coke-landing-page
    - todo-list
    - dictionary

open_source:            # pull requests merged into other people's projects
  min_stars: 100         # leave out smaller projects
  limit: 8               # biggest first
  exclude:
    - is-a-dev/register                       # domain registration, not code
    - firstcontributions/first-contributions  # a tutorial
